# =============================================================================
# Geração de Colunas e Classificação Multimodal
# =============================================================================
# Ordem: visão -> PLN -> tabular, todos com split.seed: 42.
# fonte.link: URL do REPOSITÓRIO Hugging Face, tem prioridade sobre fonte.nome.
# Adaptadores: BLIP, NLI de sentimento e encoder semântico com mean pooling.
# Downloads: models/huggingface, pesos ajustados: models/runs/<execução>/.
# BLIP produz descrições em inglês enquanto o PLN aceita texto em português/inglês.
# image_score: média geométrica das probabilidades dos tokens de conteúdo.
# text_*_similarity: cossenos em [-1, 1] para similaridades de texto.
# tabular_profile_cluster: é um código nominal e não ordem de urgência nem target.
schema_version: 3

global_config:
  dataset: data/processed/chamados.parquet
  target_col: target_category

  split:
    enabled: true
    id_column: ticket_id
    strategy: group
    train_size: 0.7
    validation_size: 0.15
    test_size: 0.15
    seed: 42
    output: data/processed/splits/chamados.json
    group_column: image_path
    group_mode: image_hash
    group_candidates: 512
    max_size_deviation: 0.1
    require_all_classes: true
    time_column: created_at
    image_column: image_path
    image_base_dir: data
    audit_columns: []
    overlap_policy: warn
    
enrichment:
  stages:
  - visao_computacional
  - pln
  - deep_learning
  max_new_columns: 10
  allow_overwrite:
  - sentiment_score

modelos:
  visao_computacional:
    enabled: true
    role: feature_generator
    adapter: blip_captioning
    features:
    - image_path
    depends_on: []
    device: auto
    fonte:
      link: null
      nome: Salesforce/blip-image-captioning-base
      revision: main
      local_files_only: false

    preprocessing:
      base_dir: data

    training:
      enabled: true
      captions_file: data/annotations/image_captions.csv
      epochs: 3
      batch_size: 2
      patience: 2
      learning_rate: 5.0e-06
      unfreeze_last_layers: 1
      max_length: 48

    generation:
      num_beams: 3
      max_new_tokens: 24
      repetition_penalty: 1.15
      no_repeat_ngram_size: 2

    outputs:
    - name: image_description
      dtype: string
      action: add
    - name: image_score
      dtype: float
      action: add
      range:
      - 0
      - 1
      
  pln:
    enabled: true
    role: feature_generator
    adapter: semantic_nlp
    features:
    - title
    - description
    depends_on: []
    device: auto
    fonte:
      link: null
      nome: MoritzLaurer/multilingual-MiniLMv2-L6-mnli-xnli
      revision: main
      local_files_only: false
      
    batch_size: 16
    max_length: 256
    
    sentiment:
      candidates:
      - hypothesis: O solicitante expressa insatisfação, frustração ou uma experiência
          negativa.
        value: -1.0
      - hypothesis: O solicitante apresenta uma informação ou pedido de forma neutra.
        value: 0.0
      - hypothesis: O solicitante expressa satisfação, agradecimento ou uma experiência
          positiva.
        value: 1.0

    # Uma coluna por grupo; cada valor é o maior cosseno com seus exemplos.
    # Ambos os campos são codificados separadamente e combinados com peso igual.
    # Ao mudar grupos, sincronize outputs, multimodal.features e max_new_columns.
    semantic:
      fonte:
        link: null
        nome: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        revision: e8f8c211226b894fcb81acc59f3b34ba3efd5f42
        local_files_only: false
        
      batch_size: 32
      max_length: 128

      prototypes:
        text_failure_similarity:
        - O sistema apresenta um erro e não funciona.
        - O equipamento parou de funcionar e preciso de reparo.
        - Não consigo realizar minha atividade porque o serviço está indisponível.

        text_access_request_similarity:
        - Solicito criação de uma conta e liberação de acesso.
        - Preciso de permissão para utilizar o sistema.
        - Quero redefinir minha senha para acessar minha conta.

        text_guidance_similarity:
        - Tenho uma dúvida e preciso de orientação para usar o sistema.
        - Gostaria de saber como realizar esta operação.
        - Solicito informações e instruções sobre o serviço.

        text_performance_similarity:
        - O sistema está lento e demora muito para responder.
        - A aplicação fica travando durante o uso.
        - O processamento demora e preciso melhorar o desempenho.

    outputs:
    - name: sentiment_score
      dtype: float
      action: replace
      range:
      - -1
      - 1
    - name: text_failure_similarity
      dtype: float
      action: add
      range:
      - -1
      - 1
    - name: text_access_request_similarity
      dtype: float
      action: add
      range:
      - -1
      - 1
    - name: text_guidance_similarity
      dtype: float
      action: add
      range:
      - -1
      - 1
    - name: text_performance_similarity
      dtype: float
      action: add
      range:
      - -1
      - 1

  deep_learning:
    enabled: true
    role: feature_generator
    adapter: tabular_profiles
    features:
    - sla_hours
    - sentiment_score
    - num_words
    - device_type
    - os
    - network_type
    depends_on:
    - pln
    device: auto

    preprocessing:
      numeric:
      - sla_hours
      - sentiment_score
      - num_words
      categorical:
      - device_type
      - os
      - network_type

    network:
      hidden_dim: 32
      latent_dim: 8

    clustering:
      n_clusters: 6

    training:
      epochs: 30
      batch_size: 64
      patience: 5
      learning_rate: 0.001

    outputs:
    - name: tabular_profile_cluster
      dtype: category
      action: add

multimodal:
  enabled: true

  classes:
  - Software
  - Rede
  - Hardware
  - RH
  - Acesso
  - Financeiro

  device: auto
  features:
    numeric:
    - sla_hours
    - sentiment_score
    - num_words
    - image_score
    - text_failure_similarity
    - text_access_request_similarity
    - text_guidance_similarity
    - text_performance_similarity

    categorical:
    - device_type
    - os
    - network_type
    - tabular_profile_cluster

    text:
      ticket:
      - title
      - description

      image:
      - image_description

  training:
    epochs: 40
    patience: 6
    min_delta: 0.0001
    cpu_threads: 2

  search:
    metric: f1_macro
    spaces:
      mlp:
        trials: 1
        parameters:
          text_max_features:
          - 1500

          text_min_df:
          - 2

          text_ngram_max:
          - 2

          class_weight:
          - null

          hidden_dims:
          - - 64
            - 128

          dropout:
          - 0.3

          learning_rate:
          - 0.001

          weight_decay:
          - 0.0001

          l2_lambda:
          - 0.001

          batch_size:
          - 32

  reports_directory: reports/fusion
  
reports:
  directory: reports/runs
